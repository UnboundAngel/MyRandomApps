<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Allentines</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@300;400;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              serif: ['Cinzel', 'serif'],
              sans: ['Lato', 'sans-serif'],
              script: ['Dancing Script', 'cursive'],
            },
            colors: {
              tangled: {
                gold: '#F2C94C',
                purple: '#6B4C9A',
                dark: '#2D1B4E',
              },
              totoro: {
                green: '#2F5233',
                leaf: '#76B041',
                forest: '#1A3C28',
              }
            },
            animation: {
              'float': 'float 6s ease-in-out infinite',
              'float-delayed': 'float 6s ease-in-out 3s infinite',
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        margin: 0;
        background-color: #6b3000; /* Match bottom of gradient */
        color: #f0fdf4;
        overflow-x: hidden; /* Fix double scrollbar */
      }
      /* Hide scrollbar */
      html {
        scrollbar-width: none; /* Firefox */
      }
      ::-webkit-scrollbar {
        display: none; /* Chrome, Safari, Edge */
      }
    </style>
  <script type="importmap">

  "imports": {

    "@google/genai": "https://esm.sh/@google/genai@^1.40.0"
  }
}
</script>

</head>
